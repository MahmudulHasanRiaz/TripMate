# TripMate v2 CI — smart + path-aware.
#
# Jobs:
#   changes     — cheap diff gate (runs always, ~seconds). Tells the heavy
#                 jobs whether any CODE path changed in this push/PR.
#   quality     — typegen + lint + typecheck + build + pure unit tests on a
#                 fresh migrated+seeded Postgres. The job ALWAYS runs (it is
#                 a required check) but when no code changed it skips the
#                 heavy steps and finishes green in ~40s instead of ~6min.
#   integration — DB-backed vitest (RUN_DB_INTEGRATION=1) + Playwright e2e,
#                 gated the same way; still waits for quality first.
#
# Optimisations:
#   - concurrency.cancel-in-progress cancels superseded runs on the same
#     branch/PR, so fast iteration never queues duplicate work.
#   - path gate: docs/asset-only changes skip install/build/tests entirely.
#   - caches: npm (setup-node), Playwright browsers, Next/Turbopack build.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff base (event.before / PR base) is local.
          fetch-depth: 0
      - name: Detect code changes
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # New branch / first push: no before commit, run the full CI.
          if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paths that affect build/lint/test. Everything else (docs, public
          # assets, Dockerfile, .env.example, README...) is non-code and skips
          # the heavy jobs.
          changed="$(git diff --name-only "$base" "$head" -- src tests drizzle scripts .github theme-colors.ts components.json next.config.ts tsconfig.json eslint.config.mjs postcss.config.mjs vitest.config.mts playwright.config.ts package.json package-lock.json)"
          if [ -n "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    needs: changes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripmate
        ports:
          - 5432:5432
        # docker create FLAGS only (no `-c` server settings — the runner
        # would parse them as docker flags); health-check flags per docs.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripmate
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-dummy-secret-not-used-at-runtime-000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (npm 12, latest)
        if: needs.changes.outputs.code == 'true'
        run: |
          npm install -g npm@12
          # --allow-remote opts into npm 12 new tarball-dep default
          # (Tailwind oxide pulls one).
          npm ci --allow-remote=all

      - name: No code changes - skipping install/build/tests
        if: needs.changes.outputs.code != 'true'
        run: echo "Only non-code files changed in this push; CI skipped."

      - name: Typegen (typed routes)
        if: needs.changes.outputs.code == 'true'
        run: npx next typegen

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck

      - name: Migrate
        if: needs.changes.outputs.code == 'true'
        run: npm run db:migrate

      - name: Seed (idempotent)
        if: needs.changes.outputs.code == 'true'
        run: npm run db:seed

      - name: Cache Next.js build (Turbopack)
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

      - name: Unit tests (DB suites self-skip)
        if: needs.changes.outputs.code == 'true'
        run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: [quality, changes]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripmate
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-integration-dummy-secret-0000000000000000
      RUN_DB_INTEGRATION: "1"
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (npm 12, latest)
        if: needs.changes.outputs.code == 'true'
        run: |
          npm install -g npm@12
          npm ci --allow-remote=all

      - name: No code changes - skipping integration/e2e
        if: needs.changes.outputs.code != 'true'
        run: echo "Only non-code files changed in this push; CI skipped."

      - name: Cache Playwright browsers
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      # 00-setup.spec.ts expects a FRESH migrated+seeded DB (it creates
      # admin@tripmate.test and locks /setup); workers:1 + sorted file order
      # keep the e2e suite serial against this one shared database.
      - name: Migrate
        if: needs.changes.outputs.code == 'true'
        run: npm run db:migrate

      - name: Seed (idempotent)
        if: needs.changes.outputs.code == 'true'
        run: npm run db:seed

      - name: DB integration tests (vitest)
        if: needs.changes.outputs.code == 'true'
        run: npm test

      - name: Playwright e2e
        if: needs.changes.outputs.code == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
