# TripMate CI — build-error-free gate.
#
# The team deploys through Vercel and Portainer, not GitHub Actions. CI's only
# job is to guarantee the code is build-error free before merge:
#
#   changes  — cheap diff gate (runs always). Tells quality whether any code
#              path changed in this push/PR (docs/asset-only pushes skip the
#              heavy job and finish green in seconds).
#   quality  — typegen + lint + typecheck + migrate + seed + production build
#              + unit tests on a fresh Postgres. No Playwright e2e and no
#              DB-integration suite here: those need a live browser + shared
#              database, they are flaky in CI, and they never gate a deploy —
#              run them locally / on demand (npm run test:e2e).
#
# Optimisations:
#   - concurrency.cancel-in-progress cancels superseded runs on the same
#     branch/PR, so fast iteration never queues duplicate work.
#   - caches: npm (setup-node), Next/Turbopack build.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head" -- src tests scripts .github theme-colors.ts components.json next.config.ts tsconfig.json eslint.config.mjs postcss.config.mjs vitest.config.mts playwright.config.ts package.json package-lock.json)"
          if [ -n "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    needs: changes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripmate
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-dummy-secret-not-used-at-runtime-000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps (npm 12, latest)
        if: needs.changes.outputs.code == 'true'
        run: |
          npm install -g npm@12
          npm ci --allow-remote=all

      - name: No code changes - skipping checks
        if: needs.changes.outputs.code != 'true'
        run: echo "Only non-code files changed in this push; CI skipped."

      - name: Typegen (typed routes)
        if: needs.changes.outputs.code == 'true'
        run: npx next typegen

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck

      - name: Migrate
        if: needs.changes.outputs.code == 'true'
        run: npm run db:migrate

      - name: Seed (idempotent)
        if: needs.changes.outputs.code == 'true'
        run: npm run db:seed

      - name: Cache Next.js build (Turbopack)
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Production build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

      - name: Unit tests (DB suites self-skip without RUN_DB_INTEGRATION)
        if: needs.changes.outputs.code == 'true'
        run: npm test
