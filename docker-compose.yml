services:
  postgres:
    image: postgres:16-alpine
    container_name: tripmate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripmate
    # Host 5433 -> container 5432: avoids clash with a host-native Postgres on 5432
    ports:
      - "5433:5432"
    volumes:
      - tripmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full production stack (Plan 7). Behind the "app" profile so the default
  # `docker compose up -d` stays "local dev Postgres only" — and keeps working
  # on a fresh clone with NO .env yet (compose interpolates every service,
  # including inactive ones, so required-syntax vars would break dev startup):
  #   docker compose --profile app up -d --build
  #
  # Values resolve from .env in this directory (compose interpolation — the
  # same file local dev uses; in Portainer paste the same variables into the
  # stack's Environment variables section). Defaults are compose-aware:
  #   * DATABASE_URL defaults to the `postgres` service. The value a local
  #     dev .env carries (localhost:543x) is wrong from inside a container —
  #     for the app profile, override it (see README Deploy section).
  #   * AUTH_SECRET has NO default on purpose: an empty value fail-fasts at
  #     boot with the zod message ("at least 32 chars"). Never bake a secret.
  app:
    profiles: ["app"]
    build: .
    container_name: tripmate-app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/tripmate}
      # Boot-time auto-migration connection (Supabase session pooler / direct).
      # Unset -> falls back to DATABASE_URL.
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:-}
      # Opt out of boot-time migrations for this stack.
      SKIP_DB_MIGRATE: ${SKIP_DB_MIGRATE:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-storage/uploads}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    ports:
      - "3000:3000"
    volumes:
      # Uploads persist across rebuilds. Bind-mounted at the same path
      # `npm run dev` writes to, so host dev and the container share media.
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tripmate_pgdata:
