services:
  postgres:
    image: postgres:16-alpine
    # No container_name on purpose: compose/Portainer names it
    # <project>-postgres-1, so containers of one deploy can never collide with
    # leftovers from an older stack and every recreate stays project-scoped.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripmate}
    # Host 5433 -> container 5432: avoids clash with a host-native Postgres on 5432
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tripmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tripmate}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M

  # Full production stack (Plan 7). Behind the "app" profile so the default
  # `docker compose up -d` stays "local dev Postgres only" — and keeps working
  # on a fresh clone with NO .env yet (compose interpolates every service,
  # including inactive ones, so required-syntax vars would break dev startup):
  #   docker compose --profile app up -d --build
  #
  # PORTAINER: do NOT point a stack at this file — stack deploys run without
  # --profile, so only Postgres would start. Use docker-compose.portainer.yml
  # (no profiles, required vars enforced at deploy time, named upload volume).
  #
  # Values resolve from .env in this directory (compose interpolation — the
  # same file local dev uses). Defaults are compose-aware:
  #   * DATABASE_URL: leave unset → the container derives it at boot from the
  #     POSTGRES_* passthrough below (host = the `postgres` service). A local
  #     dev .env DOES set DATABASE_URL (localhost:543x) — that value is wrong
  #     from inside a container, so for the app profile override it on the
  #     command (see README Deploy section) or blank it.
  #   * AUTH_SECRET has NO default on purpose: an empty value fail-fasts at
  #     boot with the zod message ("at least 32 chars"). Never bake a secret.
  app:
    profiles: ["app"]
    build:
      context: .
      # Build-time only (next.config.ts image whitelist). Set R2_PUBLIC_URL
      # here when STORAGE_DRIVER=r2.
      args:
        R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    environment:
      NODE_ENV: production
      # Empty → derived from POSTGRES_* at boot (same wiring as the portainer
      # file). Set to a full URL to use an external database instead.
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripmate}
      # Boot-time auto-migration connection (Supabase session pooler / direct).
      # Unset -> falls back to DATABASE_URL.
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:-}
      # Opt out of boot-time migrations for this stack.
      SKIP_DB_MIGRATE: ${SKIP_DB_MIGRATE:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-storage/uploads}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Meta CAPI conversion tracking (optional; all three go together).
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_TEST_CODE: ${META_CAPI_TEST_CODE:-}
      # Shared rate limiting through Upstash Redis (optional; both go together).
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Uploads persist across rebuilds. Bind-mounted at the same path
      # `npm run dev` writes to, so host dev and the container share media.
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
    restart: unless-stopped

volumes:
  tripmate_pgdata:
